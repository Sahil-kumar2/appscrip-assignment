server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # SSE Real-time Change Log Stream
    location /api/stream {
        proxy_pass http://api:3000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Buffering no;
    }

    # APS API Endpoints
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ {
        proxy_pass http://api:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /readyz {
        proxy_pass http://api:3000/readyz;
        proxy_http_version 1.1;
    }

    location /healthz {
        proxy_pass http://api:3000/healthz;
        proxy_http_version 1.1;
    }

    # Notification Sink Proxy
    location /sink/ {
        proxy_pass http://notification-sink:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
